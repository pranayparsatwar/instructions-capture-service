spring:
  application:
    name: instructions-capture-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.example.instructions.kafka.PlatformTradeSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: com.example.instructions.kafka.PlatformTradeDeserializer
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  kafka:
    outbound:
      topic: instructions.outbound
      group-id: instructions-capture-service
      partitions: 1
      replication-factor: 1
